# Backend test environment: real PostgreSQL + Redis, no secrets, no network exposure.
#   docker compose -f compose.test.yml run --rm --build tests
#   docker compose -f compose.test.yml down -v
name: captions-test

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: captions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./deploy/postgres/test-roles.sql:/docker-entrypoint-initdb.d/10-test-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d captions"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  tests:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        WORKDIR /app
        COPY backend/requirements.txt backend/requirements-dev.txt backend/requirements-localaudio.txt ./
        RUN pip install --no-cache-dir -r requirements-dev.txt
        COPY backend/ ./
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: test
      REDIS_HOST: redis
      APP_SECRET_KEY: test-secret-key-not-for-production
      COOKIE_SECURE: "false"
      ADMIN_ORIGIN: http://admin.test
      PUBLIC_BASE_URL: https://captions.test
      TRUSTED_PROXY_HOPS: "0"
      STATIC_DIR: /nonexistent
    volumes:
      - ./backend:/app  # always test the working tree, not a stale image copy
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
