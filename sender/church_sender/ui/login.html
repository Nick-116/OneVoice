<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · OneVoice Sender</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="login">
    <form class="glass login-card" id="loginForm" autocomplete="on">
      <div class="brand">
        <img src="icon.svg" alt="" />
        <div>
          <div class="brand-name">One<span>Voice</span> Sender</div>
          <div class="brand-sub">Raspberry Pi</div>
        </div>
      </div>
      <p class="muted">Sign in with the username and password you set when flashing this Pi.</p>
      <label class="field">
        <span>Username</span>
        <input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required />
      </label>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
