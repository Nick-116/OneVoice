name: Docs site

# Builds docs/ with MkDocs Material and publishes it to GitHub Pages:
# https://nick-116.github.io/OneVoice/

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "sender/README.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.5.44 mdx-truly-sane-lists==1.3
      - name: Assemble pages
        run: cp sender/README.md docs/SENDER.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
