name: Release

# Builds OneVoice Sender for macOS (Apple Silicon + Intel) and Windows and publishes
# a GitHub Release. Triggered by pushing a tag like v1.2.0.
#
# Code signing is optional and switches on automatically when these repository
# secrets exist (Settings -> Secrets and variables -> Actions):
#   macOS:   MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password for notarization)
#   Windows: WINDOWS_CERT_PFX (base64 .pfx code-signing cert), WINDOWS_CERT_PASSWORD
# Without them, macOS builds are ad-hoc signed and Windows builds are unsigned
# (users see a one-time Gatekeeper / SmartScreen prompt; see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sender
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        run: echo "ONEVOICE_VERSION=$(cat ../VERSION)" >> "$GITHUB_ENV"
      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8 pytest==8.3.3 pytest-asyncio==0.24.0
      - name: Test
        run: python -m pytest -q
      - name: Import signing certificate
        if: env.HAS_MAC_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build app
        run: pyinstaller --noconfirm --clean sender.spec
      - name: Sign
        run: |
          APP="dist/OneVoice Sender.app"
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --options runtime --timestamp --entitlements assets/entitlements.plist -s "$MACOS_SIGN_IDENTITY" "$APP"
          else
            codesign --force --deep -s - "$APP"   # ad-hoc: runs after a one-time right-click > Open
          fi
          codesign --verify --deep --strict "$APP" && echo "signature OK"
      - name: Build DMG
        run: |
          mkdir -p dmg && cp -R "dist/OneVoice Sender.app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil on CI runners intermittently fails with "Resource busy": retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "OneVoice Sender" -srcfolder dmg -ov -format UDZO "dist/OneVoiceSender-${ONEVOICE_VERSION}-macOS-${{ matrix.arch }}.dmg" && break
            echo "hdiutil failed (attempt $i), retrying"; sleep $((i * 5))
            [ "$i" = 5 ] && exit 1
          done
      - name: Notarize
        if: env.HAS_MAC_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/OneVoiceSender-${ONEVOICE_VERSION}-macOS-${{ matrix.arch }}.dmg"
          codesign --force --timestamp -s "$MACOS_SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: sender/dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sender
        shell: pwsh
    env:
      HAS_WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        run: '"ONEVOICE_VERSION=$((Get-Content ../VERSION).Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Install
        run: pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8 pytest==8.3.3 pytest-asyncio==0.24.0
      - name: Test
        run: python -m pytest -q
      - name: Build app
        run: pyinstaller --noconfirm --clean sender.spec
      - name: Sign executables
        if: env.HAS_WIN_CERT == 'true'
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\OneVoiceSender\OneVoiceSender.exe dist\OneVoiceSender\OneVoiceSender-cli.exe
      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:ONEVOICE_VERSION" installer\OneVoiceSender.iss
      - name: Sign installer
        if: env.HAS_WIN_CERT == 'true'
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 (Get-ChildItem dist\*-Setup.exe).FullName
      - name: Portable zip
        run: Compress-Archive -Path dist\OneVoiceSender\* -DestinationPath "dist\OneVoiceSender-$env:ONEVOICE_VERSION-Windows-Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            sender/dist/*-Setup.exe
            sender/dist/*-Portable.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v$(cat VERSION)"; fi
          NOTES=".github/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "OneVoice $TAG" --notes-file "$NOTES"
          fi
